  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    html, body { margin: 0; height: 100%; background: #1658A4; }
    #sistema { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #F0F6FB; }
    #portada {
      position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      padding: 24px; color: #fff; font: 500 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center;
      background: radial-gradient(70% 60% at 85% 10%, rgba(71, 159, 213, .7), rgba(71, 159, 213, 0) 65%), #1658A4;
      transition: opacity .45s cubic-bezier(.23, 1, .32, 1);
    }
    #portada.oculta { opacity: 0; pointer-events: none; }
    .tarjeta { background: #fff; border-radius: 32px; padding: 26px 30px; box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .45); }
    .tarjeta img { display: block; width: min(260px, 64vw); height: auto; }
    .giro { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .35); border-top-color: #fff; animation: girar .8s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }
    #ayuda { display: none; max-width: 320px; margin: 0; }
    #ayuda a { color: #fff; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { .giro { animation-duration: 2.4s; } #portada { transition: none; } }
  </style>
</head>
<body>
  <div id="portada" role="status" aria-live="polite">
    <div class="tarjeta"><img src="https://cdn.jsdelivr.net/gh/luviostudiope-cell/casino-pimentel@f6a3942b2e1c/vercel/logo.png" alt="Casino de Pimentel" width="260" height="81"></div>
    <div class="giro" aria-hidden="true"></div>
    <p style="margin:0">Abriendo el sistema del club…</p>
    <p id="ayuda">Está tardando más de lo normal. <a id="directo" target="_top">Abrir el sistema directamente</a></p>
  </div>
  <iframe id="sistema" title="Sistema del Casino de Pimentel" allow="clipboard-write"></iframe>
  <script>
    // El sistema vive en Google Apps Script; esta página solo le da una dirección corta.
    var SISTEMA = 'https://script.google.com/macros/s/AKfycbyIuh872nN7qy3mP9R3z6mOwbKDSsZkpSzU7OVp17ypTo8J34uEkT1TSh-MBw_ixb9L/exec';
    var marco = document.getElementById('sistema');
    var portada = document.getElementById('portada');
    document.getElementById('directo').href = SISTEMA;
    marco.addEventListener('load', function () { setTimeout(function () { portada.classList.add('oculta'); }, 600); });
    marco.src = SISTEMA;
    setTimeout(function () { document.getElementById('ayuda').style.display = 'block'; }, 15000);
  </script>
</body>
