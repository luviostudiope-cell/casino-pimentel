<script>
(function () {
  'use strict';

  // ================= Base =================
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var app = $('#app'), capa = $('#capa'), avisoEl = $('#aviso');
  var E = { token: null, perfil: null, vista: null, params: {}, datos: {}, seq: 0, pedido: {}, teclado: null, hoy: null };
  var ACC = {}, FORM = {}, ENTRADA = {};

  var almacen = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } },
  };

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function ic(n) {
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (window.ICONOS[n] || '') + '</svg>';
  }
  function soles(n) { return 'S/ ' + Number(n || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function solesCorto(n) { return 'S/ ' + Number(n || 0).toLocaleString('es-PE', { maximumFractionDigits: 0 }); }
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function partes(iso) { var p = String(iso).split('-').map(Number); return { a: p[0], m: p[1], d: p[2], f: new Date(Date.UTC(p[0], p[1] - 1, p[2], 12)) }; }
  function fechaLarga(iso) { var p = partes(iso); return DIAS[p.f.getUTCDay()] + ' ' + p.d + ' de ' + MESES[p.m - 1]; }
  function fechaMedia(iso) { var p = partes(iso); return DIAS[p.f.getUTCDay()].slice(0, 3) + ' ' + p.d + ' ' + MESES[p.m - 1].slice(0, 3); }
  function fechaCorta(iso) { var p = partes(iso); return p.d + ' ' + MESES[p.m - 1].slice(0, 3); }
  function mayuscula(t) { return String(t).replace(/^./, function (c) { return c.toUpperCase(); }); }
  function diaRelativo(iso, hoy) {
    if (iso === hoy) return 'Hoy';
    var dif = Math.round((partes(iso).f - partes(hoy).f) / 86400000);
    if (dif === 1) return 'Mañana';
    if (dif === -1) return 'Ayer';
    return fechaMedia(iso);
  }
  function sumarDias(iso, n) { var p = partes(iso); var f = new Date(Date.UTC(p.a, p.m - 1, p.d + n, 12)); return f.toISOString().slice(0, 10); }
  function hoyLocal() {
    if (E.hoy) return E.hoy;
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function iniciales(nombre) {
    var p = String(nombre || '').split(' ').filter(Boolean);
    if (!p.length) return '·';
    var segundo = p.length >= 4 ? p[p.length - 2] : (p[1] || '');
    return (p[0][0] + (segundo[0] || '')).toUpperCase();
  }
  function saludo() { var h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; }
  function plural(n, uno, varios) { return n + ' ' + (n === 1 ? uno : varios); }

  // ================= Comunicación con el servidor =================
  function llamar(accion, datos) {
    return new Promise(function (ok, mal) {
      google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.ok) return ok(r.datos);
          if (r && r.sinSesion && accion !== 'salir') { cerrarSesionLocal(); render(); }
          mal(new Error((r && r.error) || 'No hubo respuesta del sistema.'));
        })
        .withFailureHandler(function (e) {
          var m = String(e && e.message || e);
          mal(new Error(/network|fetch|conexi/i.test(m) ? 'No hay conexión a internet. Revisa y vuelve a intentar.' : 'Hubo un problema con el sistema. Intenta otra vez.'));
        })
        .api(accion, E.token, datos || {});
    });
  }

  // ================= Avisos, ventana emergente y estados =================
  var avisoTiempo;
  function avisar(texto, tipo) {
    tipo = tipo || 'ok';
    avisoEl.className = tipo;
    avisoEl.innerHTML = ic(tipo === 'ok' ? 'ok' : 'alerta') + '<span>' + esc(texto) + '</span>';
    void avisoEl.offsetWidth;
    avisoEl.classList.add('visible');
    clearTimeout(avisoTiempo);
    avisoTiempo = setTimeout(function () { avisoEl.classList.remove('visible'); }, tipo === 'ok' ? 3400 : 6000);
  }
  function fallo(e) { avisar(e && e.message ? e.message : String(e), 'error'); }

  var focoAnterior = null;
  function abrirModal(html, alAbrir) {
    focoAnterior = document.activeElement;
    capa.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    capa.classList.add('abierta');
    document.body.style.overflow = 'hidden';
    var m = capa.firstElementChild;
    ajustarSegmentos(m);
    if (alAbrir) alAbrir(m);
    setTimeout(function () {
      var f = m.querySelector('[data-foco]') || m.querySelector('input:not([type=radio]):not([type=checkbox]):not([type=hidden]), textarea');
      if (f && window.matchMedia('(pointer: fine)').matches) f.focus();
    }, 40);
  }
  function cerrarModal() {
    capa.classList.remove('abierta');
    capa.innerHTML = '';
    document.body.style.overflow = '';
    if (focoAnterior && focoAnterior.focus) try { focoAnterior.focus(); } catch (e) { /* nada */ }
  }
  capa.addEventListener('mousedown', function (e) { if (e.target === capa) cerrarModal(); });
  function modalCab(titulo, sub) {
    return '<div class="modal-cab"><div><h2>' + esc(titulo) + '</h2>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>' +
      '<button type="button" class="btn btn-icono btn-plano" data-a="cerrarModal" aria-label="Cerrar">' + ic('cerrar') + '</button></div>';
  }
  function confirmar(titulo, texto, boton, peligro) {
    return new Promise(function (ok) {
      abrirModal(modalCab(titulo) + '<p style="color:var(--tinta-2);font-size:16px">' + esc(texto) + '</p><div class="modal-pie mt-l">' +
        '<button class="btn" data-a="cerrarModal">Volver</button><button class="btn ' + (peligro ? 'btn-peligro-lleno' : 'btn-primario') + '" id="btnSi">' + esc(boton) + '</button></div>',
        function (m) { $('#btnSi', m).addEventListener('click', function () { cerrarModal(); ok(true); }); });
    });
  }
  function ocupado(btn, si) {
    if (!btn) return;
    if (si) { btn.dataset.texto = btn.innerHTML; btn.classList.add('ocupado'); btn.innerHTML = '<span class="giro" style="width:20px;height:20px;border-width:2px"></span> Guardando…'; }
    else { btn.classList.remove('ocupado'); if (btn.dataset.texto) btn.innerHTML = btn.dataset.texto; }
  }
  function cargando() { return '<div class="cargando" role="status"><div class="giro"></div><span>Cargando…</span></div>'; }
  function vacio(icono, texto) { return '<div class="vacio">' + ic(icono) + '<p>' + esc(texto) + '</p></div>'; }

  // ================= Ayuda de cada sección =================
  var AYUDA = {
    inicio: ['Cómo usar el inicio', [
      'Los <b>cuadros de arriba</b> muestran los números de hoy: quién está en el club, cuánto vendió la barra, cómo va la caja y cuántos socios están al día.',
      '<b>Para revisar hoy</b> te avisa lo que necesita atención. Tócalo y te lleva directo a resolverlo.',
      'Usa <b>¿Qué quieres hacer?</b> para empezar una tarea con un solo toque.',
    ]],
    porteria: ['Cómo funciona portería', [
      'Escribe el <b>DNI, el nombre o el código del carnet</b> del socio. Un lector de códigos también funciona.',
      'Revisa su estado: <b>verde</b> está al día, <b>amarillo</b> debe cuotas. Puede entrar igual y se le avisa.',
      'Toca <b>Registrar ingreso</b>. Para su familia, toca el nombre de cada familiar.',
      'Para un <b>invitado</b>: llena su nombre y DNI y elige a dónde entra: <b>club</b>, <b>piscina</b> o <b>comedor</b> (libre). Cobra e imprime su ticket; el cobro entra solo a la caja.',
      'Cuando alguien se va, toca <b>Salida</b> en la lista de abajo.',
    ]],
    asistencia: ['Cómo marca el personal', [
      'Cada trabajador tiene un <b>PIN de 4 números</b>.',
      'La <b>primera vez</b> que lo escribe en el día marca su <b>entrada</b>; la segunda, su <b>salida</b>.',
      'Si llega más de 10 minutos tarde, el sistema anota la tardanza solo.',
    ]],
    socios: ['Cómo funciona socios', [
      'Busca por nombre, DNI o código, o filtra por <b>al día</b>, <b>con deuda</b> o <b>suspendidos</b>.',
      'Toca un socio para ver su <b>ficha</b>: datos, familia y sus cuotas del año en colores.',
      'Con <b>Registrar pago</b> marcas las cuotas que paga. Se imprime un recibo y el dinero entra solo a la caja.',
      'Cada mes, el botón <b>Generar cuotas</b> crea la cuota de todos los socios activos.',
    ]],
    socio: ['Cómo usar la ficha', [
      'Arriba ves si está <b>al día</b> o cuánto debe.',
      '<b>Registrar pago</b> cobra una o varias cuotas e imprime el recibo.',
      '<b>Reiniciar PIN</b> sirve si el socio olvidó su clave: vuelve a los últimos 6 números de su DNI.',
      '<b>Cobrar consumos</b> cobra lo que el socio cargó a su cuenta en la barra.',
    ]],
    barra: ['Cómo funciona la barra', [
      'Toca los <b>productos</b> para armar el pedido. Con + y − cambias la cantidad.',
      'Elige <b>cómo paga</b>: efectivo, Yape, Plin, tarjeta o <b>a la cuenta</b> del socio (lo buscas y se le cobra después en administración). Toca <b>Cobrar</b>.',
      '<b>Imprime el ticket</b> y entrégalo en la barra para que preparen el pedido. No es boleta ni factura.',
      'En <b>Stock</b> registras la mercadería que llega. El sistema avisa cuando queda poco.',
    ]],
    caja: ['Cómo funciona la caja', [
      'Todo lo que se cobra en <b>portería, barra, cuotas y alquileres</b> entra solo aquí.',
      'Los gastos (hielo, gas, limpieza) se registran con <b>Nuevo movimiento</b>.',
      'Al cerrar el día, cuenta los billetes y toca <b>Cerrar caja</b>: el sistema te dice si cuadra.',
      'Con <b>Día anterior</b> revisas cualquier día pasado.',
    ]],
    personal: ['Cómo funciona personal', [
      'Cada trabajador marca su entrada y salida con su PIN en <b>Portería → Asistencia</b>.',
      'Aquí ves quién está <b>trabajando</b>, quién <b>salió</b> y quién <b>no marcó</b>.',
      'En <b>Equipo y semana</b> ves los días trabajados y las tardanzas, y agregas trabajadores nuevos.',
    ]],
    reservas: ['Cómo funcionan las reservas', [
      'Elige el <b>día</b> arriba.',
      'Toca un horario <b>Libre</b> de la cancha de tenis. Cada turno dura una hora.',
      'Busca al socio y confirma. El socio también puede reservar desde su celular.',
      'Cada socio puede reservar <b>una vez por día</b> y hasta <b>3 veces por semana</b>, con 7 días de anticipación. La cancha de básquet es de uso libre.',
    ]],
    alquileres: ['Cómo funcionan los alquileres', [
      'Toca <b>Nuevo alquiler</b>, elige el ambiente y el tipo de cliente: el <b>precio se pone solo</b>.',
      'Si deja <b>adelanto</b>, queda confirmado y el dinero entra a la caja.',
      'Toca un alquiler para <b>cobrar el saldo</b>, marcarlo como realizado o cancelarlo.',
      'Al rincón parrillero se le puede sumar el <b>uso de cocina</b> (S/ 400).',
      'El sistema no deja alquilar el mismo ambiente dos veces el mismo día.',
    ]],
    avisos: ['Cómo funcionan los avisos', [
      'Escribe un <b>título</b> corto y el <b>mensaje</b>.',
      'Toca <b>Publicar</b>: los socios lo ven en su celular, en su cuenta.',
      'Cuando ya no sirva, toca <b>Ocultar</b>.',
    ]],
    ajustes: ['Cómo funcionan los ajustes', [
      'En <b>Reglas del club</b> cambias la cuota, las tarifas de invitados y los límites.',
      'En <b>Usuarios del personal</b> cambias las claves de acceso.',
      'Todo se guarda en una hoja de <b>Google Sheets</b> que puedes abrir y descargar.',
    ]],
    micuenta: ['Cómo usar tu cuenta', [
      'Arriba ves si estás <b>al día</b> con tus cuotas.',
      'Toca <b>Mi carnet</b> y muéstralo en portería para entrar.',
      'Si cargaste consumos de la barra a tu cuenta, los ves en <b>Mis consumos</b>.',
      'Reserva la <b>cancha de tenis</b> desde tu celular.',
      'En <b>Avisos del club</b> te enteras de las novedades.',
    ]],
    carnet: ['Cómo usar tu carnet', [
      'Muestra este código en <b>portería</b>: el portero lo lee y registra tu ingreso.',
      'Tu familia registrada puede entrar contigo.',
    ]],
  };
  function hero(o) {
    var ejemplo = E.perfil && E.perfil.ejemplo ? '<span class="etiqueta-ejemplo"><i></i>Datos de ejemplo</span>' : '';
    var ayuda = o.ayuda ? '<button class="btn btn-sm" data-a="ayuda" data-v="' + o.ayuda + '">' + ic('info') + 'Cómo funciona</button>' : '';
    return '<section class="hero">' +
      '<div class="hero-arriba"><span class="hero-etiqueta">' + (o.icono ? ic(o.icono) : '') + esc(o.etiqueta || '') + '</span>' + ejemplo + '</div>' +
      (o.antes || '') +
      '<h1>' + esc(o.titulo) + '</h1>' + (o.sub ? '<p class="sub">' + esc(o.sub) + '</p>' : '') +
      (o.despues || '') +
      ((o.acciones || ayuda) ? '<div class="hero-acciones">' + (o.acciones || '') + ayuda + '</div>' : '') +
      '</section>';
  }

  // ================= Selector deslizante (pestañas y filtros) =================
  function segmento(lista, activa, accion, esPestana) {
    return '<div class="segmento"' + (esPestana ? ' role="tablist"' : '') + '><span class="seg-pulgar" aria-hidden="true"></span>' + lista.map(function (o) {
      var si = o[0] === activa;
      return '<button type="button"' + (esPestana ? ' role="tab" aria-selected="' + si + '"' : ' aria-pressed="' + si + '"') + ' class="' + (si ? 'activo' : '') + '" data-a="' + accion + '" data-v="' + esc(o[0]) + '">' + esc(o[1]) + '</button>';
    }).join('') + '</div>';
  }
  function pestanas(lista, activa, accion) { return '<div class="centro-x mb">' + segmento(lista, activa, accion, true) + '</div>'; }
  function moverPulgar(seg, animar) {
    var b = seg.querySelector('button.activo'), p = seg.querySelector('.seg-pulgar');
    if (!b || !p) return;
    if (!animar) p.style.transition = 'none';
    p.style.width = b.offsetWidth + 'px';
    p.style.transform = 'translateX(' + b.offsetLeft + 'px)';
    seg.classList.add('listo');
    if (!animar) { void p.offsetWidth; p.style.transition = ''; }
  }
  function ajustarSegmentos(raiz) { (raiz || document).querySelectorAll('.segmento').forEach(function (s) { moverPulgar(s, false); }); }
  function activarEnSegmento(el) {
    var seg = el.closest('.segmento');
    seg.querySelectorAll('button').forEach(function (b) {
      var si = b === el;
      b.classList.toggle('activo', si);
      if (b.hasAttribute('aria-selected')) b.setAttribute('aria-selected', si); else b.setAttribute('aria-pressed', si);
    });
    moverPulgar(seg, true);
  }
  window.addEventListener('resize', function () { ajustarSegmentos(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { ajustarSegmentos(); });

  // ================= Formularios =================
  function opciones(nombre, lista, elegido) {
    return '<div class="opciones" role="radiogroup">' + lista.map(function (o) {
      return '<label class="opcion"><input type="radio" name="' + nombre + '" value="' + esc(o[0]) + '"' + (o[0] === elegido ? ' checked' : '') + '><span>' + esc(o[1]) + '</span></label>';
    }).join('') + '</div>';
  }
  var MEDIOS = [['efectivo', 'Efectivo'], ['yape', 'Yape'], ['plin', 'Plin'], ['tarjeta', 'Tarjeta'], ['transferencia', 'Transferencia']];
  function campo(etq, html, ayuda) { return '<label class="campo"><span>' + esc(etq) + '</span>' + html + (ayuda ? '<small>' + esc(ayuda) + '</small>' : '') + '</label>'; }
  function grupo(etq, html, ayuda) { return '<div class="campo"><span>' + esc(etq) + '</span>' + html + (ayuda ? '<small>' + esc(ayuda) + '</small>' : '') + '</div>'; }
  function entrada(nombre, valor, extra) { return '<input class="entrada" name="' + nombre + '" value="' + esc(valor == null ? '' : valor) + '" ' + (extra || '') + '>'; }
  function datosForm(f) {
    var o = {};
    new FormData(f).forEach(function (v, k) { o[k] = v; });
    return o;
  }
  function estadoSocio(s) {
    if (s.estado === 'suspendido') return '<span class="etiqueta peligro">Suspendido</span>';
    if (s.cuenta.alDia) return '<span class="etiqueta ok">Al día</span>';
    return '<span class="etiqueta alerta">Debe ' + plural(s.cuenta.vencidas, 'cuota', 'cuotas') + '</span>';
  }

  // Calendario propio
  function textoFecha(iso, modo) {
    var p = partes(iso);
    return modo === 'nacimiento' ? p.d + ' de ' + MESES[p.m - 1] + ' de ' + p.a : mayuscula(fechaLarga(iso)) + (p.a !== partes(hoyLocal()).a ? ' de ' + p.a : '');
  }
  function campoFecha(etq, nombre, valor, op) {
    op = op || {};
    var id = 'f_' + nombre;
    return '<div class="campo"><span>' + esc(etq) + '</span>' +
      '<button type="button" class="selector' + (valor ? '' : ' vacio-sel') + '" id="' + id + '_b" data-a="abrirFecha" data-id="' + id + '" aria-expanded="false"><span>' + esc(valor ? textoFecha(valor, op.modo) : 'Elegir fecha') + '</span>' + ic('reservas') + '</button>' +
      '<input type="hidden" name="' + nombre + '" id="' + id + '" value="' + esc(valor || '') + '" data-min="' + esc(op.min || '') + '" data-max="' + esc(op.max || '') + '" data-modo="' + esc(op.modo || '') + '">' +
      '<div class="desplegable" id="' + id + '_d"><div><div class="panel-cal" id="' + id + '_p"></div></div></div>' +
      (op.ayuda ? '<small>' + esc(op.ayuda) + '</small>' : '') + '</div>';
  }
  function cerrarDesplegables(excepto) {
    document.querySelectorAll('.desplegable.abierto').forEach(function (d) { if (d.id !== excepto) d.classList.remove('abierto'); });
    document.querySelectorAll('.selector.abierto').forEach(function (s) { if (s.dataset.id + '_d' !== excepto) { s.classList.remove('abierto'); s.setAttribute('aria-expanded', 'false'); } });
  }
  function alternar(id) {
    var d = $('#' + id + '_d'), b = $('#' + id + '_b');
    var abrir = !d.classList.contains('abierto');
    cerrarDesplegables(id + '_d');
    d.classList.toggle('abierto', abrir);
    b.classList.toggle('abierto', abrir);
    b.setAttribute('aria-expanded', abrir);
    return abrir;
  }
  ACC.abrirFecha = function (el) {
    var id = el.dataset.id, inp = $('#' + id), p = $('#' + id + '_p');
    var nacimiento = inp.dataset.modo === 'nacimiento';
    var base = partes(inp.value || (nacimiento ? '1975-06-15' : hoyLocal()));
    p.dataset.anio = base.a; p.dataset.mes = base.m;
    p.dataset.vista = nacimiento && !inp.value ? 'anios' : 'dias';
    pintarCalendario(id);
    alternar(id);
  };
  function pintarCalendario(id) {
    var inp = $('#' + id), p = $('#' + id + '_p');
    var anio = Number(p.dataset.anio), mes = Number(p.dataset.mes), vista = p.dataset.vista;
    var min = inp.dataset.min, max = inp.dataset.max, valor = inp.value, hoy = hoyLocal();
    var boton = function (accion, paso, icono, etq) { return '<button type="button" data-a="' + accion + '" data-id="' + id + '" data-paso="' + paso + '" aria-label="' + etq + '">' + ic(icono) + '</button>'; };
    var h = '';
    if (vista === 'dias') {
      h += '<div class="cal-cab">' + boton('calMover', -1, 'izquierda', 'Mes anterior') + '<button type="button" class="cal-titulo" data-a="calVista" data-id="' + id + '" data-v="meses">' + MESES[mes - 1] + ' ' + anio + '</button>' + boton('calMover', 1, 'derecha', 'Mes siguiente') + '</div>';
      h += '<div class="cal-dias">' + ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(function (d) { return '<span class="dsem">' + d + '</span>'; }).join('');
      var inicio = (new Date(Date.UTC(anio, mes - 1, 1)).getUTCDay() + 6) % 7;
      var total = new Date(Date.UTC(anio, mes, 0)).getUTCDate();
      for (var i = 0; i < inicio; i++) h += '<span></span>';
      for (var d = 1; d <= total; d++) {
        var iso = anio + '-' + ('0' + mes).slice(-2) + '-' + ('0' + d).slice(-2);
        var fuera = (min && iso < min) || (max && iso > max);
        h += '<button type="button" class="' + (iso === valor ? 'elegido ' : '') + (iso === hoy ? 'hoy' : '') + '" data-a="calDia" data-id="' + id + '" data-v="' + iso + '"' + (fuera ? ' disabled' : '') + '>' + d + '</button>';
      }
      h += '</div>';
    } else if (vista === 'meses') {
      h += '<div class="cal-cab">' + boton('calMover', -12, 'izquierda', 'Año anterior') + '<button type="button" class="cal-titulo" data-a="calVista" data-id="' + id + '" data-v="anios">' + anio + '</button>' + boton('calMover', 12, 'derecha', 'Año siguiente') + '</div>';
      h += '<div class="cal-rejilla">' + MESES.map(function (m, i) {
        return '<button type="button" class="' + (valor && partes(valor).a === anio && partes(valor).m === i + 1 ? 'elegido' : '') + '" data-a="calMes" data-id="' + id + '" data-v="' + (i + 1) + '">' + m + '</button>';
      }).join('') + '</div>';
    } else {
      var desde = anio - (anio % 12);

    nuevoPin.pin += el.dataset.d;
    var p = $('#puntosPin'); if (p) p.innerHTML = puntos(nuevoPin.pin.length, 6, false);
    if (nuevoPin.pin.length < 6) return;
    setTimeout(function () {
      var pin = nuevoPin.pin;
      if (!nuevoPin.primero) {
        if (/^(\d)\1+$/.test(pin) || '0123456789'.indexOf(pin) >= 0 || '9876543210'.indexOf(pin) >= 0) { nuevoPin.error = 'Ese PIN es muy fácil de adivinar. Elige otro.'; nuevoPin.pin = ''; }
        else { nuevoPin.primero = pin; nuevoPin.pin = ''; }
        return pintarCambiarPin();
      }
      if (pin !== nuevoPin.primero) { nuevoPin = { primero: '', pin: '', error: 'Los PIN no coinciden. Empecemos otra vez.' }; return pintarCambiarPin(); }
      nuevoPin.enviando = true;

  ACC.estadoAlquiler = function (el) {
    var v = el.dataset.v;
    confirmar(v === 'cancelado' ? 'Cancelar alquiler' : 'Marcar como realizado', v === 'cancelado' ? 'El ambiente quedará libre ese día.' : 'El evento ya se hizo.', v === 'cancelado' ? 'Cancelar alquiler' : 'Marcar realizado', v === 'cancelado').then(function () {
      llamar('cambiarEstadoAlquiler', { id: el.dataset.id, estado: v }).then(function () { avisar('Alquiler actualizado.'); pintarVista(); }).catch(fallo);
    });
  };

  // ================= AVISOS =================
  VISTAS.avisos = function (c, n) {
    return llamar('listarAvisos').then(function (lista) {
      if (!vigente(n)) return;
      E.datos.avisos = lista;
      var admin = E.perfil.rol === 'admin';
      c.innerHTML = hero({ etiqueta: 'Avisos', icono: 'avisos', titulo: 'Avisos para los socios', sub: 'Lo que publiques aquí lo ven los socios en su celular, en su cuenta del club.', ayuda: 'avisos' }) +
        '<div class="rejilla-2" style="margin-top:0">' +
        (admin ? '<section class="tarjeta"><h2>Nuevo aviso</h2><p class="sub">Escríbelo como se lo dirías a un socio</p><form class="formulario mt" data-f="aviso">' + campo('Título', entrada('titulo', '', 'maxlength="100" placeholder="Por ejemplo: Cierre de piscina"')) +
          campo('Mensaje', '<textarea class="entrada" name="texto" maxlength="600" placeholder="Por ejemplo: El lunes la piscina estará cerrada por mantenimiento."></textarea>') +
          '<button type="submit" class="btn btn-primario">' + ic('avisos') + 'Publicar aviso</button></form></section>' : '') +
        '<section class="tarjeta"><h2>Publicados</h2><div class="pila mt">' + (lista.length ? lista.map(function (a) {
          return '<div class="aviso-tarjeta"' + (a.activo ? '' : ' style="opacity:.6"') + '><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><b>' + esc(a.titulo) + '</b>' +
            (admin ? '<button class="btn btn-sm" data-a="toggleAviso" data-id="' + a.id + '">' + (a.activo ? 'Ocultar' : 'Mostrar') + '</button>' : '') + '</div>' +
            '<p>' + esc(a.texto) + '</p><small>' + mayuscula(fechaMedia(a.fecha)) + ' · ' + (a.activo ? 'Visible para los socios' : 'Oculto') + '</small></div>';
        }).join('') : vacio('avisos', 'Todavía no hay avisos.')) + '</div></section></div>';
    });
  };
  FORM.aviso = function (f, d, btn) {
    ocupado(btn, true);
    llamar('guardarAviso', d).then(function () { avisar('Aviso publicado.'); pintarVista(); }).catch(function (e) { ocupado(btn, false); fallo(e); });
  };
  ACC.toggleAviso = function (el) {
    var a = E.datos.avisos.find(function (x) { return x.id === el.dataset.id; });
    el.disabled = true;
    llamar('guardarAviso', { id: a.id, titulo: a.titulo, texto: a.texto, activo: !a.activo }).then(function () { avisar(a.activo ? 'Aviso oculto.' : 'Aviso visible.'); pintarVista(); }).catch(function (e) { el.disabled = false; fallo(e); });
  };

  // ================= AJUSTES =================
  VISTAS.ajustes = function (c, n) {
    return llamar('ajustes').then(function (d) {
      if (!vigente(n)) return;
      E.datos.ajustes = d;
      var campos = d.config.filter(function (x) { return x.clave !== 'club_nombre' && x.clave !== 'datos_de_ejemplo'; }).map(function (x) {
        if (x.clave === 'bloquear_morosos') return grupo(x.descripcion, opciones(x.clave, [['NO', 'Puede entrar y se le avisa'], ['SI', 'No puede entrar']], x.valor === 'SI' ? 'SI' : 'NO'));
        return campo(x.descripcion, entrada(x.clave, x.valor, 'type="number" min="0" inputmode="decimal"'));
      }).join('');
      var ejemplo = d.config.find(function (x) { return x.clave === 'datos_de_ejemplo'; });
      c.innerHTML = hero({ etiqueta: 'Ajustes', icono: 'ajustes', titulo: 'Reglas y accesos', sub: 'Cambia las reglas del club, las claves del personal y revisa la base de datos.', ayuda: 'ajustes' }) +
        '<div class="rejilla-2" style="margin-top:0"><section class="tarjeta"><h2>Reglas del club</h2><p class="sub">Se aplican al instante en todo el sistema</p><form class="formulario mt" data-f="ajustes">' + campos +
        '<button type="submit" class="btn btn-primario">' + ic('check') + 'Guardar reglas</button></form></section>' +
        '<div class="pila"><section class="tarjeta"><h2>Usuarios del personal</h2><div class="lista mt">' + d.usuarios.map(function (u) {
          return '<div class="fila"><span class="icono-circulo azul">' + ic('usuario') + '</span><div class="principal"><div class="nombre">' + esc(u.usuario) + '</div><div class="meta">' + esc(u.rol) + '</div></div><button class="btn btn-sm" data-a="claveUsuario" data-id="' + u.id + '" data-u="' + esc(u.usuario) + '">' + ic('llave') + 'Cambiar clave</button></div>';
        }).join('') + '</div></section>' +
        '<section class="tarjeta"><h2>Base de datos</h2><p class="sub mt">Todo se guarda en una hoja de Google Sheets que puedes abrir, filtrar o descargar.</p>' +
        '<div class="acciones"><a class="btn" href="' + esc(d.hojaUrl) + '" target="_blank" rel="noopener">' + ic('hoja') + 'Abrir en Google Sheets</a></div>' +
        (ejemplo && ejemplo.valor === 'SI' ? '<div class="nota alerta mt">' + ic('alerta') + '<span>El sistema tiene datos de ejemplo. Antes de la presentación puedes dejarlos como al inicio.</span></div><div class="acciones"><button class="btn btn-peligro" data-a="reiniciarEjemplo">' + ic('recargar') + 'Reiniciar datos de ejemplo</button></div>' : '') +
        '</section></div></div>';
    });
  };
  FORM.ajustes = function (f, d, btn) {
    ocupado(btn, true);
    llamar('guardarAjustes', { valores: d }).then(function () { ocupado(btn, false); avisar('Reglas guardadas.'); }).catch(function (e) { ocupado(btn, false); fallo(e); });
  };
  ACC.claveUsuario = function (el) {
    abrirModal(modalCab('Cambiar clave', 'Usuario ' + el.dataset.u) + '<form class="formulario" data-f="claveUsuario"><input type="hidden" name="id" value="' + el.dataset.id + '">' +
      campo('Clave nueva', entrada('clave', '', 'type="text" autocomplete="off" minlength="8" data-foco'), 'Al menos 8 caracteres. Anótala y entrégala a la persona.') +
      '<div class="modal-pie"><button type="button" class="btn" data-a="cerrarModal">Cancelar</button><button type="submit" class="btn btn-primario">' + ic('check') + 'Guardar clave</button></div></form>');
  };
  FORM.claveUsuario = function (f, d, btn) {
    ocupado(btn, true);
    llamar('cambiarClaveUsuario', d).then(function () { cerrarModal(); avisar('Clave cambiada.'); }).catch(function (e) { ocupado(btn, false); fallo(e); });
  };
  ACC.reiniciarEjemplo = function () {
    confirmar('Reiniciar datos de ejemplo', 'Se borran todos los movimientos de prueba y se vuelven a cargar los datos de ejemplo. Las claves del personal vuelven a ser las iniciales.', 'Reiniciar', true).then(function () {
      avisar('Reiniciando… puede tardar unos segundos.', 'alerta');
      llamar('reiniciarDatosEjemplo').then(function () { avisar('Datos de ejemplo listos.'); ir('inicio'); }).catch(fallo);
    });
  };

  // ================= APP DEL SOCIO =================
  VISTAS.micuenta = function (c, n) {
    return llamar('miCuenta').then(function (s) {
      if (!vigente(n)) return;
      E.datos.mia = s; E.hoy = s.hoy;
      var cu = s.cuenta;
      var estado = cu.alDia
        ? '<div class="estado-socio"><span class="icono-circulo ok">' + ic('check') + '</span>Estás al día' + (cu.proximaVence ? ' · tu próxima cuota vence el ' + fechaLarga(cu.proximaVence) : '') + '</div>'
        : '<div class="estado-socio"><span class="icono-circulo alerta">' + ic('alerta') + '</span>Tienes ' + plural(cu.vencidas, 'cuota vencida', 'cuotas vencidas') + ' por ' + soles(cu.deudaVencida) + '</div>';
      var meses = s.cuotas.slice(0, 12).reverse().map(function (q) {
        return '<div class="mes ' + q.estado + '"><b>' + esc(q.mes.split(' ')[0]) + '</b>' + (q.estado === 'pagada' ? 'Pagada' : q.estado === 'vencida' ? 'Vencida' : 'Por pagar') + '</div>';
      }).join('');
      var reservas = s.reservas.length ? s.reservas.map(function (r) {
        return '<div class="fila"><span class="icono-circulo azul">' + ic('reservas') + '</span><div class="principal"><div class="nombre">' + esc(nombreCancha(r.cancha)) + ' · ' + esc(r.hora) + '</div><div class="meta">' + esc(diaRelativo(r.fecha, s.hoy)) + ', ' + fechaLarga(r.fecha) + '</div></div></div>';
      }).join('') : '<div class="vacio" style="padding:20px 8px">' + ic('reservas') + '<p>No tienes reservas próximas.</p><button class="btn btn-sm mt" data-a="ir" data-v="reservas">Reservar tenis</button></div>';
      var avisos = s.avisos.length ? s.avisos.map(function (a) {
        return '<div class="aviso-tarjeta"><b>' + esc(a.titulo) + '</b><p>' + esc(a.texto) + '</p><small>' + mayuscula(fechaMedia(a.fecha)) + '</small></div>';
      }).join('') : '<p class="sub">No hay avisos nuevos.</p>';
      var pagos = s.pagos.length ? s.pagos.slice(0, 5).map(function (p) {
        return '<div class="fila"><span class="icono-circulo ok">' + ic('dinero') + '</span><div class="principal"><div class="nombre">' + esc(p.periodos.join(', ')) + '</div><div class="meta">' + fechaMedia(p.fecha) + ' · ' + esc(p.medio) + '</div></div><span class="monto">' + soles(p.monto) + '</span></div>';
      }).join('') : '<p class="sub">Todavía no hay pagos.</p>';
      var familia = s.familiares.length ? s.familiares.map(function (f) {
        return '<div class="fila"><span class="avatar">' + esc(iniciales(f.nombre)) + '</span><div class="principal"><div class="nombre">' + esc(f.nombre) + '</div><div class="meta">' + esc(mayuscula(f.parentesco)) + '</div></div></div>';
      }).join('') : '<p class="sub">No tienes familiares registrados.</p>';
      c.innerHTML = hero({ etiqueta: 'Casino de Pimentel', antes: '<div class="saludo-socio" style="margin-bottom:6px"><img src="' + window.SOL_CLUB + '" alt=""><div><h1 style="margin:0">Hola, ' + esc(s.nombres.split(' ')[0]) + '</h1><p class="sub" style="margin-top:4px">Socio ' + esc(s.codigo) + ' · bienvenido a tu club</p></div></div>', titulo: '', despues: estado, ayuda: 'micuenta' }).replace('<h1></h1>', '') +
        '<section class="atajos socio">' +
        atajo('qr', 'azul', 'Mi carnet', 'Muéstralo en portería', 'carnet') +
        atajo('reservas', 'sol', 'Reservar tenis', 'Separa tu cancha', 'reservas') +
        '<button class="atajo" data-a="irA" data-id="misCuotas"><span class="icono-circulo ok">' + ic('dinero') + '</span><b>Mis cuotas</b><span>Lo pagado y lo pendiente</span></button>' +
        '<button class="atajo" data-a="irA" data-id="misAvisos"><span class="icono-circulo azul">' + ic('avisos') + '</span><b>Avisos</b><span>Novedades del club</span></button>' +
        '</section>' +
        '<div class="rejilla-2"><section class="tarjeta" id="misCuotas"><h2>Mis cuotas</h2>' +
        (cu.alDia ? '<div class="grande-num" style="color:var(--ok)">Al día</div><p class="sub">' + (cu.porPagar ? 'Próxima cuota ' + soles(cu.porPagar) + (cu.proximaVence ? ', vence el ' + fechaLarga(cu.proximaVence) : '') : 'No tienes cuotas pendientes') + '</p>'
          : '<div class="grande-num" style="color:var(--peligro)">' + soles(cu.deudaVencida) + '</div><p class="sub">Acércate a administración para ponerte al día.</p>') +
        '<div class="meses">' + meses + '</div></section>' +
        '<section class="tarjeta" id="misAvisos"><h2>Avisos del club</h2><div class="pila mt">' + avisos + '</div></section></div>' +
        (s.consumos.length ? '<section class="tarjeta mt"><div class="tarjeta-cab"><div><h2>Mis consumos a cuenta</h2><p>Por pagar en administración: <b>' + soles(s.consumosTotal) + '</b></p></div></div><div class="lista">' + s.consumos.map(function (v) {
          return '<div class="fila"><span class="icono-circulo sol">' + ic('barra') + '</span><div class="principal"><div class="nombre">' + mayuscula(fechaMedia(v.fecha)) + ' · ' + esc(v.hora) + '</div><div class="meta" style="white-space:normal">' + esc(v.resumen) + '</div></div><span class="monto">' + soles(v.total) + '</span></div>';
        }).join('') + '</div></section>' : '') +
        '<div class="rejilla-2"><section class="tarjeta"><h2>Mis reservas de tenis</h2><div class="lista mt">' + reservas + '</div></section>' +
        '<section class="tarjeta"><h2>Mi familia</h2><p class="sub">Pueden entrar con tu carnet</p><div class="lista mt">' + familia + '</div><h2 class="mt-l">Mis últimos pagos</h2><div class="lista mt">' + pagos + '</div></section></div>';
    });
  };
  VISTAS.carnet = function (c, n) {
    return llamar('miCuenta').then(function (s) {
      if (!vigente(n)) return;
      var qr = '';
      try { var q = window.qrcode(0, 'M'); q.addData(s.carnet); q.make(); qr = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true }); }
      catch (e) { qr = '<div class="vacio">' + ic('qr') + '<p>' + esc(s.carnet) + '</p></div>'; }
      c.innerHTML = hero({ etiqueta: 'Mi carnet', icono: 'carnet', titulo: 'Tu carnet de socio', sub: 'Muéstralo en portería al entrar al club.', ayuda: 'carnet' }) +
        '<div class="carnet"><div class="carnet-cab"><img src="' + window.SOL_CLUB + '" alt=""><div><b>Casino de Pimentel</b><span>Carnet de socio</span></div></div>' +
        '<div class="carnet-cuerpo"><div class="carnet-qr">' + qr + '</div><div class="carnet-nombre">' + esc(s.nombre) + '</div>' +
        '<p class="carnet-datos">Socio ' + esc(s.codigo) + ' · DNI ' + esc(s.dni) + '</p><div class="etiquetas mt" style="justify-content:center">' + estadoSocio(s) + '</div></div></div>' +
        (s.familiares.length ? '<section class="tarjeta mt-l" style="max-width:400px;margin-left:auto;margin-right:auto"><h2>Pueden entrar contigo</h2><div class="lista mt">' + s.familiares.map(function (f) {
          return '<div class="fila"><span class="avatar">' + esc(iniciales(f.nombre)) + '</span><div class="principal"><div class="nombre">' + esc(f.nombre) + '</div><div class="meta">' + esc(mayuscula(f.parentesco)) + '</div></div></div>';
        }).join('') + '</div></section>' : '');
    });
  };

  // ================= Arranque =================
  E.token = almacen.get('cp_token');
  if (E.token) {
    app.innerHTML = cargando();
    llamar('miPerfil').then(function (p) { E.perfil = p; E.ejemplo = p.ejemplo; render(); }).catch(function () { cerrarSesionLocal(); render(); });
  } else {
    llamar('estadoPublico').then(function (d) { E.ejemplo = d.ejemplo; if (!E.token) render(); }).catch(function () { render(); });
    render();
  }
})();
</script>
