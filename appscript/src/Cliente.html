<script>
(function () {
  'use strict';

  // ================= Base =================
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var app = $('#app'), capa = $('#capa'), avisoEl = $('#aviso');
  var E = { token: null, perfil: null, vista: null, params: {}, datos: {}, seq: 0, pedido: {}, teclado: null };

  var almacen = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } },
  };

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function ic(n) {
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (window.ICONOS[n] || '') + '</svg>';
  }
  function soles(n) {
    return 'S/ ' + Number(n || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function solesCorto(n) {
    return 'S/ ' + Number(n || 0).toLocaleString('es-PE', { maximumFractionDigits: 0 });
  }
  var DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function partes(iso) { var p = String(iso).split('-').map(Number); return { a: p[0], m: p[1], d: p[2], f: new Date(Date.UTC(p[0], p[1] - 1, p[2], 12)) }; }
  function fechaLarga(iso) { var p = partes(iso); return DIAS[p.f.getUTCDay()] + ' ' + p.d + ' de ' + MESES[p.m - 1]; }
  function fechaMedia(iso) { var p = partes(iso); return DIAS[p.f.getUTCDay()].slice(0, 3) + ' ' + p.d + ' ' + MESES[p.m - 1].slice(0, 3); }
  function fechaCorta(iso) { var p = partes(iso); return p.d + ' ' + MESES[p.m - 1].slice(0, 3); }
  function diaRelativo(iso, hoy) {
    if (iso === hoy) return 'Hoy';
    var dif = Math.round((partes(iso).f - partes(hoy).f) / 86400000);
    if (dif === 1) return 'Mañana';
    if (dif === -1) return 'Ayer';
    return fechaMedia(iso);
  }
  function mesDe(periodo) { var p = String(periodo).split('-').map(Number); return MESES[p[1] - 1] + ' ' + p[0]; }
  function sumarDias(iso, n) { var p = partes(iso); var f = new Date(Date.UTC(p.a, p.m - 1, p.d + n, 12)); return f.toISOString().slice(0, 10); }
  function iniciales(nombre) {
    var p = String(nombre || '').split(' ').filter(Boolean);
    if (!p.length) return '·';
    var segundo = p.length >= 4 ? p[p.length - 2] : (p[1] || '');
    return (p[0][0] + (segundo[0] || '')).toUpperCase();
  }
  function saludo() { var h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; }
  function plural(n, uno, varios) { return n + ' ' + (n === 1 ? uno : varios); }

  // ================= Comunicación con el servidor =================
  function llamar(accion, datos) {
    return new Promise(function (ok, mal) {
      google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.ok) return ok(r.datos);
          if (r && r.sinSesion && accion !== 'salir') { cerrarSesionLocal(); render(); }
          mal(new Error((r && r.error) || 'No hubo respuesta del sistema.'));
        })
        .withFailureHandler(function (e) {
          var m = String(e && e.message || e);
          mal(new Error(/network|fetch|conexi/i.test(m) ? 'No hay conexión a internet. Revisa y vuelve a intentar.' : 'Hubo un problema con el sistema. Intenta otra vez.'));
        })
        .api(accion, E.token, datos || {});
    });
  }

  // ================= Avisos, ventana emergente y estados =================
  var avisoTiempo;
  function avisar(texto, tipo) {
    tipo = tipo || 'ok';
    avisoEl.className = tipo;
    avisoEl.innerHTML = ic(tipo === 'ok' ? 'ok' : 'alerta') + '<span>' + esc(texto) + '</span>';
    void avisoEl.offsetWidth;
    avisoEl.classList.add('visible');
    clearTimeout(avisoTiempo);
    avisoTiempo = setTimeout(function () { avisoEl.classList.remove('visible'); }, tipo === 'ok' ? 3400 : 6000);
  }
  function fallo(e) { avisar(e && e.message ? e.message : String(e), 'error'); }

  var focoAnterior = null;
  function abrirModal(html, alAbrir) {
    focoAnterior = document.activeElement;
    capa.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    capa.classList.add('abierta');
    document.body.style.overflow = 'hidden';
    var m = capa.firstElementChild;
    if (alAbrir) alAbrir(m);
    setTimeout(function () {
      var f = m.querySelector('[autofocus]') || m.querySelector('input:not([type=radio]):not([type=checkbox]), select, textarea');
      if (f && window.matchMedia('(pointer: fine)').matches) f.focus();
    }, 40);
  }
  function cerrarModal() {
    capa.classList.remove('abierta');
    capa.innerHTML = '';
    document.body.style.overflow = '';
    if (focoAnterior && focoAnterior.focus) try { focoAnterior.focus(); } catch (e) { /* nada */ }
  }
  capa.addEventListener('mousedown', function (e) { if (e.target === capa) cerrarModal(); });
  function modalCab(titulo, sub) {
    return '<div class="modal-cab"><div><h2>' + esc(titulo) + '</h2>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>' +
      '<button type="button" class="btn btn-icono btn-plano" data-a="cerrarModal" aria-label="Cerrar">' + ic('cerrar') + '</button></div>';
  }
  function confirmar(titulo, texto, boton, peligro) {
    return new Promise(function (ok) {
      abrirModal(modalCab(titulo) + '<p style="color:var(--tinta-2)">' + esc(texto) + '</p><div class="modal-pie mt-l">' +
        '<button class="btn" data-a="cerrarModal">Volver</button><button class="btn ' + (peligro ? 'btn-peligro-lleno' : 'btn-primario') + '" id="btnSi">' + esc(boton) + '</button></div>',
        function (m) { $('#btnSi', m).addEventListener('click', function () { cerrarModal(); ok(true); }); });
    });
  }
  function ocupado(btn, si) {
    if (!btn) return;
    if (si) { btn.dataset.texto = btn.innerHTML; btn.classList.add('ocupado'); btn.innerHTML = '<span class="giro" style="width:20px;height:20px;border-width:2px"></span> Guardando…'; }
    else { btn.classList.remove('ocupado'); if (btn.dataset.texto) btn.innerHTML = btn.dataset.texto; }
  }
  function cargando() { return '<div class="cargando" role="status"><div class="giro"></div><span>Cargando…</span></div>'; }
  function vacio(icono, texto) { return '<div class="vacio">' + ic(icono) + '<p>' + esc(texto) + '</p></div>'; }
  function cabecera(titulo, sub, acciones) {
    return '<header class="cabecera"><h1>' + esc(titulo) + '</h1>' + (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') +
      (acciones ? '<div class="acciones-cabecera">' + acciones + '</div>' : '') + '</header>';
  }
  function pestanas(opciones, activa, accion) {
    return '<div class="centro-x mb"><div class="pestanas" role="tablist">' + opciones.map(function (o) {
      return '<button role="tab" aria-selected="' + (o[0] === activa) + '" class="' + (o[0] === activa ? 'activo' : '') + '" data-a="' + accion + '" data-v="' + o[0] + '">' + esc(o[1]) + '</button>';
    }).join('') + '</div></div>';
  }
  function opciones(nombre, lista, elegido) {
    return '<div class="opciones" role="radiogroup">' + lista.map(function (o) {
      return '<label class="opcion"><input type="radio" name="' + nombre + '" value="' + esc(o[0]) + '"' + (o[0] === elegido ? ' checked' : '') + '><span>' + esc(o[1]) + '</span></label>';
    }).join('') + '</div>';
  }
  var MEDIOS = [['efectivo', 'Efectivo'], ['yape', 'Yape'], ['plin', 'Plin'], ['tarjeta', 'Tarjeta'], ['transferencia', 'Transferencia']];
  function campo(etq, html, ayuda) { return '<label class="campo"><span>' + esc(etq) + '</span>' + html + (ayuda ? '<small>' + esc(ayuda) + '</small>' : '') + '</label>'; }
  function entrada(nombre, valor, extra) { return '<input class="entrada" name="' + nombre + '" value="' + esc(valor == null ? '' : valor) + '" ' + (extra || '') + '>'; }
  function datosForm(f) {
    var o = {};
    new FormData(f).forEach(function (v, k) { o[k] = v; });
    return o;
  }
  function estadoSocio(s) {
    if (s.estado === 'suspendido') return '<span class="etiqueta peligro">Suspendido</span>';
    if (s.cuenta.alDia) return '<span class="etiqueta ok">Al día</span>';
    return '<span class="etiqueta alerta">Debe ' + plural(s.cuenta.vencidas, 'cuota', 'cuotas') + '</span>';
  }

  // ================= Acciones por clic y formularios =================
  var ACC = {}, FORM = {}, ENTRADA = {};
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    var fn = ACC[el.dataset.a];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-f]');
    if (!f) return;
    e.preventDefault();
    var fn = FORM[f.dataset.f];
    if (fn) fn(f, datosForm(f), f.querySelector('[type=submit]'));
  });
  document.addEventListener('input', function (e) {
    var el = e.target.closest('[data-in]');
    if (el && ENTRADA[el.dataset.in]) ENTRADA[el.dataset.in](el, e);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && capa.classList.contains('abierta')) { cerrarModal(); return; }
    if (!E.teclado || capa.classList.contains('abierta')) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    if (/^\d$/.test(e.key)) { e.preventDefault(); E.teclado.tecla(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); E.teclado.borrar(); }
  });
  ACC.cerrarModal = cerrarModal;

  function teclado(prefijo) {
    var t = '';
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach(function (d) { t += '<button type="button" class="tecla" data-a="' + prefijo + 'Tecla" data-d="' + d + '">' + d + '</button>'; });
    t += '<button type="button" class="tecla suave" data-a="' + prefijo + 'Borrar" aria-label="Borrar">' + ic('retroceso') + '</button>';
    t += '<button type="button" class="tecla" data-a="' + prefijo + 'Tecla" data-d="0">0</button><span></span>';
    return '<div class="teclado">' + t + '</div>';
  }
  function puntos(llenos, total, error) {
    var h = '';
    for (var i = 0; i < total; i++) h += '<i class="' + (i < llenos ? 'lleno' : '') + '"></i>';
    return '<div class="puntos' + (error ? ' error' : '') + '" aria-label="' + llenos + ' de ' + total + ' números">' + h + '</div>';
  }

  // ================= Sesión =================
  function cerrarSesionLocal() { E.token = null; E.perfil = null; E.vista = null; E.pedido = {}; almacen.set('cp_token', null); }

  var MENU = {
    admin: ['inicio', 'porteria', 'socios', 'barra', 'caja', 'personal', 'reservas', 'alquileres', 'avisos'],
    directiva: ['inicio', 'porteria', 'socios', 'barra', 'caja', 'personal', 'reservas', 'alquileres', 'avisos'],
    porteria: ['porteria', 'reservas'],
    barra: ['barra'],
    socio: ['micuenta', 'carnet', 'reservas'],
  };
  var NAV = {
    inicio: ['Inicio', 'inicio'], porteria: ['Portería', 'porteria'], socios: ['Socios', 'socios'], barra: ['Barra', 'barra'],
    caja: ['Caja', 'caja'], personal: ['Personal', 'personal'], reservas: ['Tenis', 'reservas'], alquileres: ['Alquileres', 'alquileres'],
    avisos: ['Avisos', 'avisos'], ajustes: ['Ajustes', 'ajustes'], micuenta: ['Mi cuenta', 'inicio'], carnet: ['Carnet', 'carnet'], socio: ['Socios', 'socios'],
  };

  function ir(vista, params) {
    E.vista = vista;
    E.params = params || {};
    E.teclado = null;
    almacen.set('cp_vista', vista);
    pintarVista();
    window.scrollTo(0, 0);
  }
  ACC.ir = function (el) {
    var p = {};
    Object.keys(el.dataset).forEach(function (k) { if (k !== 'a' && k !== 'v') p[k] = el.dataset[k]; });
    cerrarModal();
    ir(el.dataset.v, p);
  };
  ACC.salir = function () {
    confirmar('¿Salir del sistema?', 'Tendrás que volver a ingresar con tu usuario o tu DNI.', 'Salir').then(function () {
      llamar('salir').catch(function () { /* igual se cierra */ });
      cerrarSesionLocal();
      render();
    });
  };

  function render() {
    E.teclado = null;
    if (!E.token || !E.perfil) return pintarAcceso();
    if (E.perfil.debeCambiarPin) return pintarCambiarPin();
    pintarMarco();
  }

  // ================= Pantalla de ingreso =================
  var ingreso = { modo: 'socio', paso: 'dni', dni: '', pin: '', error: '' };
  function pintarAcceso() {
    var cuerpo;
    if (ingreso.modo === 'socio' && ingreso.paso === 'dni') {
      cuerpo = '<form class="formulario" data-f="dni" novalidate>' +
        campo('Tu DNI', '<input class="entrada dni-entrada" name="dni" inputmode="numeric" autocomplete="username" maxlength="8" placeholder="8 números" value="' + esc(ingreso.dni) + '" autofocus>') +
        '<div class="error-campo" role="alert">' + esc(ingreso.error) + '</div>' +
        '<button class="btn btn-primario btn-lg btn-bloque" type="submit">Continuar</button></form>';
    } else if (ingreso.modo === 'socio') {
      cuerpo = '<div class="pila" style="align-items:center">' +
        '<div style="display:flex;width:100%;align-items:center;justify-content:space-between"><button class="btn btn-sm btn-plano" data-a="cambiarDni">' + ic('atras') + ' Cambiar DNI</button><span class="num" style="color:var(--gris)">DNI ' + esc(ingreso.dni) + '</span></div>' +
        '<p style="font-weight:500;font-size:18px">Escribe tu PIN de 6 números</p>' +
        '<div id="puntosPin">' + puntos(ingreso.pin.length, 6, Boolean(ingreso.error)) + '</div>' +
        '<div class="error-campo" role="alert" id="errorPin" style="text-align:center">' + esc(ingreso.error) + '</div>' +
        teclado('pin') + '</div>';
      E.teclado = { tecla: function (d) { ACC.pinTecla({ dataset: { d: d } }); }, borrar: function () { ACC.pinBorrar(); } };
    } else {
      cuerpo = '<form class="formulario" data-f="personal" novalidate>' +
        campo('Usuario', '<input class="entrada" name="usuario" autocomplete="username" autocapitalize="none" placeholder="Por ejemplo: porteria" autofocus>') +
        campo('Clave', '<input class="entrada" name="clave" type="password" autocomplete="current-password">') +
        '<div class="error-campo" role="alert">' + esc(ingreso.error) + '</div>' +
        '<button class="btn btn-primario btn-lg btn-bloque" type="submit">Ingresar</button></form>';
    }
    app.innerHTML = '<main class="acceso"><div class="acceso-caja">' +
      '<img class="acceso-logo" src="' + window.LOGO_CLUB + '" alt="Casino de Pimentel">' +
      cabecera('Bienvenido al club', ingreso.modo === 'socio' ? 'Ingresa con tu DNI y tu PIN' : 'Ingresa con tu usuario del club') +
      '<div class="pestanas" role="tablist">' +
      '<button role="tab" class="' + (ingreso.modo === 'socio' ? 'activo' : '') + '" data-a="modoIngreso" data-v="socio">Soy socio</button>' +
      '<button role="tab" class="' + (ingreso.modo === 'personal' ? 'activo' : '') + '" data-a="modoIngreso" data-v="personal">Personal del club</button></div>' +
      '<section class="tarjeta">' + cuerpo + '</section>' +
      '<p class="acceso-pie">¿Olvidaste tu PIN o tu clave? Pídelo en administración.</p>' +
      (E.ejemplo ? '<span class="etiqueta sol">Datos de ejemplo</span>' : '') +
      '</div></main>';
    var f = app.querySelector('[autofocus]');
    if (f && window.matchMedia('(pointer: fine)').matches) f.focus();
  }
  ACC.modoIngreso = function (el) { ingreso.modo = el.dataset.v; ingreso.paso = 'dni'; ingreso.pin = ''; ingreso.error = ''; pintarAcceso(); };
  ACC.cambiarDni = function () { ingreso.paso = 'dni'; ingreso.pin = ''; ingreso.error = ''; pintarAcceso(); };
  FORM.dni = function (f, d) {
    var dni = String(d.dni || '').replace(/\D/g, '');
    if (dni.length !== 8) { ingreso.error = 'Escribe tu DNI completo: son 8 números.'; ingreso.dni = dni; pintarAcceso(); return; }
    ingreso.dni = dni; ingreso.paso = 'pin'; ingreso.pin = ''; ingreso.error = '';
    pintarAcceso();
  };
  function repintarPin() {
    var p = $('#puntosPin'); if (p) p.innerHTML = puntos(ingreso.pin.length, 6, Boolean(ingreso.error));
    var e = $('#errorPin'); if (e) e.textContent = ingreso.error;
  }
  var enviandoPin = false;
  ACC.pinTecla = function (el) {
    if (enviandoPin || ingreso.pin.length >= 6) return;
    ingreso.error = '';
    ingreso.pin += el.dataset.d;
    repintarPin();
    if (ingreso.pin.length === 6) {
      enviandoPin = true;
      var e = $('#errorPin'); if (e) e.textContent = 'Entrando…';
      llamar('ingresar', { modo: 'socio', dni: ingreso.dni, pin: ingreso.pin }).then(entrar).catch(function (er) {
        ingreso.error = er.message; ingreso.pin = ''; repintarPin();
      }).then(function () { enviandoPin = false; });
    }
  };
  ACC.pinBorrar = function () { if (enviandoPin) return; ingreso.pin = ingreso.pin.slice(0, -1); ingreso.error = ''; repintarPin(); };
  FORM.personal = function (f, d, btn) {
    ocupado(btn, true);
    llamar('ingresar', { modo: 'personal', usuario: d.usuario, clave: d.clave }).then(entrar).catch(function (er) {
      ingreso.error = er.message; pintarAcceso();
      var u = app.querySelector('[name=usuario]'); if (u) u.value = d.usuario || '';
      var c = app.querySelector('[name=clave]'); if (c) c.focus();
    });
  };
  function entrar(r) {
    E.token = r.token; E.perfil = r.perfil; E.ejemplo = r.perfil.ejemplo;
    almacen.set('cp_token', r.token);
    ingreso = { modo: ingreso.modo, paso: 'dni', dni: '', pin: '', error: '' };
    E.vista = MENU[r.perfil.rol][0];
    render();
  }

  // ================= Primer ingreso del socio: crear su PIN =================
  var nuevoPin = { primero: '', pin: '', error: '' };
  function pintarCambiarPin() {
    app.innerHTML = '<main class="acceso"><div class="acceso-caja">' +
      '<img class="acceso-logo" src="' + window.LOGO_CLUB + '" alt="Casino de Pimentel">' +
      cabecera(nuevoPin.primero ? 'Repite tu nuevo PIN' : 'Crea tu PIN personal', nuevoPin.primero ? 'Escríbelo otra vez para confirmar' : 'Son 6 números que solo tú vas a saber') +
      '<section class="tarjeta pila" style="align-items:center">' +
      '<div id="puntosPin">' + puntos(nuevoPin.pin.length, 6, Boolean(nuevoPin.error)) + '</div>' +
      '<div class="error-campo" id="errorPin" role="alert" style="text-align:center">' + esc(nuevoPin.error) + '</div>' + teclado('npin') +
      '<div class="nota">' + ic('info') + '<span>No uses tu fecha de nacimiento ni números seguidos como 123456.</span></div></section>' +
      '<button class="btn btn-plano" data-a="salirDirecto">Salir</button></div></main>';
    E.teclado = { tecla: function (d) { ACC.npinTecla({ dataset: { d: d } }); }, borrar: function () { ACC.npinBorrar(); } };
  }
  ACC.salirDirecto = function () { llamar('salir').catch(function () {}); cerrarSesionLocal(); render(); };
  ACC.npinTecla = function (el) {
    if (nuevoPin.pin.length >= 6 || nuevoPin.enviando) return;
    nuevoPin.error = '';
    nuevoPin.pin += el.dataset.d;
    var p = $('#puntosPin'); if (p) p.innerHTML = puntos(nuevoPin.pin.length, 6, false);
    if (nuevoPin.pin.length < 6) return;
    setTimeout(function () {
      var pin = nuevoPin.pin;
      if (!nuevoPin.primero) {
        if (/^(\d)\1+$/.test(pin) || '0123456789'.indexOf(pin) >= 0 || '9876543210'.indexOf(pin) >= 0) { nuevoPin.error = 'Ese PIN es muy fácil de adivinar. Elige otro.'; nuevoPin.pin = ''; }
        else { nuevoPin.primero = pin; nuevoPin.pin = ''; }
        return pintarCambiarPin();
      }
      if (pin !== nuevoPin.primero) { nuevoPin = { primero: '', pin: '', error: 'Los PIN no coinciden. Empecemos otra vez.' }; return pintarCambiarPin(); }
      nuevoPin.enviando = true;
      llamar('cambiarPin', { pin: pin }).then(function () {
        nuevoPin = { primero: '', pin: '', error: '' };
        E.perfil.debeCambiarPin = false;
        avisar('Listo. Desde ahora entras con tu nuevo PIN.');
        render();
      }).catch(function (er) { nuevoPin = { primero: '', pin: '', error: er.message }; pintarCambiarPin(); });
    }, 140);
  };
  ACC.npinBorrar = function () { nuevoPin.pin = nuevoPin.pin.slice(0, -1); var p = $('#puntosPin'); if (p) p.innerHTML = puntos(nuevoPin.pin.length, 6, false); };

  // ================= Marco: menú lateral, barra móvil =================
  function itemNav(v, clase) {
    var n = NAV[v];
    return '<button class="item ' + (clase || '') + '" data-a="ir" data-v="' + v + '" data-nav="' + v + '">' + ic(n[1]) + '<span>' + n[0] + '</span></button>';
  }
  function pintarMarco() {
    var items = MENU[E.perfil.rol];
    if (!E.vista) E.vista = almacen.get('cp_vista') || items[0];

  function pintarSocios() {

    llamar('miPerfil').then(function (p) { E.perfil = p; E.ejemplo = p.ejemplo; render(); }).catch(function () { cerrarSesionLocal(); render(); });
  } else {
    llamar('estadoPublico').then(function (d) { E.ejemplo = d.ejemplo; if (!E.token) render(); }).catch(function () { render(); });
    render();
  }
})();
</script>
