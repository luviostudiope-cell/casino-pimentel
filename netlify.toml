[build]
  command = "npm --prefix web ci && npm --prefix app ci && node scripts/construir.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# La app es una SPA servida en /app
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(), microphone=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
